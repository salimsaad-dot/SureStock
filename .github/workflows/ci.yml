# Product-testing pass, 2026-08-28, gap #7: the first CI this project
# has ever had. Every prior "193/193, stable across two runs" claim in
# progress.md was a developer running the suite by hand on one machine —
# this is what turns that into something that happens automatically on
# every push, whether or not anyone remembers to run it.
#
# Deliberately scoped to what's foundational: backend typecheck/lint/
# test against a real MariaDB (this project's actual database — not a
# mock, matching every existing test's own discipline), frontend
# typecheck/lint/build, and a build-only check that both deploy/
# Dockerfiles actually produce an image. Playwright E2E in CI (needs the
# whole stack — backend, db, and the built frontend — running together)
# is a real, deliberate scope cut for this first pass, not an oversight;
# worth adding once this foundation is in place, not before.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: surestock_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # setup-env.ts (this project's own Vitest setupFiles hook) points
      # DATABASE_URL at TEST_DATABASE_URL for the actual test run — both
      # are set here so `prisma generate`/`migrate deploy` and `npm test`
      # all see a consistent, real, reachable database.
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/surestock_test
      TEST_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/surestock_test
      MIGRATE_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/surestock_test
      JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-00000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/SureStock-backend
      - run: npx prisma migrate deploy
        working-directory: apps/SureStock-backend
      - run: npm run typecheck --workspace=@surestock/api
      - run: npm run lint --workspace=@surestock/api
      - run: npm run test --workspace=@surestock/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@surestock/web
      - run: npm run lint --workspace=@surestock/web
      - run: npm run build --workspace=@surestock/web

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
