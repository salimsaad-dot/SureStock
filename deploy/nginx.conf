# Product-testing pass, 2026-08-28, gap #7.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite content-hashes every built asset filename (dist/assets/*), so
    # a cached-forever response is always correct — a new build simply
    # produces new filenames, never reuses a stale one under a name a
    # browser already has cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html itself must never be cached — it's the one file whose
    # content genuinely changes on every deploy (it references that
    # build's hashed asset filenames), and a stale cached copy would
    # point a returning visitor at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # React Router's client-side routes (e.g. /sell, /inventory/42) have
    # no matching file on disk — fall back to index.html and let the SPA's
    # own router decide what to render, instead of nginx's default 404.
    location / {
        try_files $uri /index.html;
    }
}
